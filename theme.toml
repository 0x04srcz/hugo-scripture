name = 'Hugo Scripture'
license = 'MIT'
licenselink = 'https://git.sourcery.zone/hugo-scripture/tree/LICENSE'
description = 'A Tufte CSS theme with sidenotes, a journal/articles split, decentralized discussions, and automatic OG images.'

# The home page of the theme, where the source can be found
homepage = 'https://git.sourcery.zone/hugo-scripture'

# If you have a running demo of the theme
demosite = 'https://sourcery.zone'

# Taxonomy terms
tags = ['blog', 'personal', 'minimal', 'tufte', 'indieweb', 'dark']
features = ['sidenotes', 'journal', 'rss', 'og-images', 'webmentions', 'posse', 'dark-mode', 'tor']

[author]
  name = 'Sourcerer'
  homepage = 'https://sourcery.zone'

[original]
  author = 'Edward Tufte / Dave Liepmann (Tufte CSS)'
  homepage = 'https://edwardtufte.github.io/tufte-css/'
  repo = 'https://github.com/edwardtufte/tufte-css'
